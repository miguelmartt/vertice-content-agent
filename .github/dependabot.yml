# El código no tiene dependencias: solo se actualizan las acciones de CI, fijadas por SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
